name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR cancels the older run instead of queueing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >=20; 22 is the LTS this is developed against.
          node-version: 22
          cache: npm

      - run: npm ci

      # test/wiki-search.test.ts exercises the real embedding path, which pulls
      # Xenova/bge-large-en-v1.5 (~440MB) from HuggingFace on a cold runner.
      # Restore AFTER `npm ci`, which wipes node_modules along with this dir.
      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-${{ runner.os }}-bge-large-en-v1.5

      - run: npm run typecheck

      # No secrets: test/setup.ts stubs CONVEX_URL, and every outbound call is
      # stubbed via vi.stubGlobal("fetch", ...). Nothing here touches a real
      # Convex deployment, ClickUp, Sendblue, or Composio.
      - run: npm test
